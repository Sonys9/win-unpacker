[package]
name = "encrypted_app"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[profile.release]
panic = "abort"
lto = true
opt-level = 3
strip = true
debug = false
codegen-units = 1

[dependencies]
goldberg = "0.1.0"
obfstr = "0.4.4"
windows-sys = { version = "0.59", features = [
    "Win32_System_SystemInformation", 
    "Win32_System_Diagnostics_Debug", 
    "Win32_Storage_FileSystem", 
    "Win32_System_SystemServices"
] }
