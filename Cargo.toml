[package]
name = "win-unpacker"
version = "0.1.0"
edition = "2024"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
opt-level = "z"
strip = true
codegen-units = 1

[dependencies]
obfstr = "0.4.4"
windows-sys = { version = "0.59", features = [
    "Win32_System_SystemInformation", 
    "Win32_Storage_FileSystem", 
    "Win32_System_SystemServices"
] }
