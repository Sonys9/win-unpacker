name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust and toolchains
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy, rustfmt
          
      - name: Cache xwin SDK
        id: cache-xwin
        uses: actions/cache@v4
        with:
          path: ~/.xwin
          key: xwin-sdk-cache

      - name: Install xwin
        run: cargo install xwin

      - name: Download Windows SDK with xwin
        if: steps.cache-xwin.outputs.cache-hit != 'true'
        run: xwin --accept-license splat --output ~/.xwin

      - name: Build with cargo-xwin
        run: cargo xwin build --target x86_64-pc-windows-msvc
        
      - name: Fmt check
        run: cargo fmt --all -- --check
      - name: Clippy Linter
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test --all
